name: Production Read-only E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"

permissions:
  contents: read

concurrency:
  group: production-readonly-e2e
  cancel-in-progress: false

jobs:
  production-readonly:
    name: 운영 공개·인증 읽기 경로
    runs-on: ubuntu-latest  # 공개 저장소는 GitHub 호스팅 분이 무료다. 온프렘 러너 그룹은 공개 저장소를 허용하지 않으므로(allows_public_repositories=false) 호스팅 러너를 쓴다(2026-10-12).
    environment: production-readonly-qa
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium  # 호스팅 러너는 시스템 의존성도 받아야 한다

      - name: 공개 운영 경로 3건
        run: npm run qa:verify-production

      - name: 인증 운영 경로 읽기 전용 E2E
        run: npm run qa:verify-production:auth
        env:
          QA_PRODUCTION_EXPECTED_APP_VERSION: "2.4.0"
          QA_PRODUCTION_PAYMENTS_ENABLED: "true"
          QA_PRODUCTION_SUPABASE_URL: ${{ secrets.QA_PRODUCTION_SUPABASE_URL }}
          QA_PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.QA_PRODUCTION_SUPABASE_ANON_KEY }}
          QA_PRODUCTION_EMAIL: ${{ secrets.QA_PRODUCTION_EMAIL }}
          QA_PRODUCTION_PASSWORD: ${{ secrets.QA_PRODUCTION_PASSWORD }}
          QA_PRODUCTION_EXPECTED_USER_ID: ${{ secrets.QA_PRODUCTION_EXPECTED_USER_ID }}

      - name: 읽기 전용 화면 증거 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readonly-e2e-evidence
          path: web/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Slack 실패 알림
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALERT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const webhook = process.env.SLACK_WEBHOOK_URL?.trim();
          if (!webhook) {
            console.error("SLACK_WEBHOOK_URL 저장소 시크릿이 필요합니다.");
            process.exit(1);
          }
          const response = await fetch(webhook, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: `❌ 해낼게 운영 읽기 전용 E2E 실패\nsource: ${process.env.ALERT_SHA}\n${process.env.ALERT_RUN_URL}`,
            }),
          });
          if (!response.ok) {
            console.error(`Slack 실패 알림 전송 실패: HTTP ${response.status}`);
            process.exit(1);
          }
          console.log("Slack 실패 알림 전송 완료");
          NODE
