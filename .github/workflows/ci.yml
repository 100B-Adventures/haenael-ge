# 회귀 테스트 CI
#
# 트리거: main 푸시 + 모든 PR + 수동 실행
#
# 커버리지 경계 (숨기지 않고 명시한다):
#   포함  = 웹 단위 테스트 전량, 결제·인증 Edge Function 보안 Vitest,
#            프로덕션 빌드, cashout-manual 브라우저 E2E
#   미포함 = cheer-payment / goal-flow / release-v1 / report-flow / wordmap-share
#            이 5개는 E2E_BASE_URL로 지정한 실행 중인 앱과 Supabase를 요구한다.
#            운영 DB에 쓰지 않는다는 원칙 때문에 CI에서 자동 실행하지 않는다.
#            이 5개는 배포 전 컨트롤러가 로컬에서 직접 실행해 증거를 남긴다.
#   미포함 = pgTAP DB 정책 테스트 63건. Docker 기반이라 별도 잡이 필요하다.
#
# cashout-manual 은 스펙 내부에 격리된 Supabase 계약 서버를 띄우므로 외부 의존이 없다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # workflow_dispatch는 staging 결제 설정을 쓰므로 브랜치가 달라도 한 번에 하나만 실행한다.
  # 로컬 수동 결제 진단은 이 workflow가 끝난 뒤에만 실행한다.
  group: ${{ github.event_name == 'workflow_dispatch' && 'haenael-staging-write' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  supabase-server-contracts:
    name: Supabase pgTAP + 서버 런타임 계약
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Supabase CLI 공식 registry override. GitHub 호스팅 러너의 ECR 공유 IP 제한을 피한다.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: GitHub Container Registry 인증
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: supabase/setup-cli@v3
        with:
          # 2.110.0부터 internal registry override 누락 회귀가 수정됐다.
          version: 2.114.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 로컬 Supabase 기동
        run: |
          # 서버 계약이 실제 사용하는 DB·Auth·REST·Storage·Kong·Edge Runtime만 기동한다.
          supabase start \
            -x realtime -x imgproxy -x mailpit -x postgres-meta -x studio \
            -x logflare -x vector -x supavisor

      - name: pgTAP 전수
        run: supabase test db

      - name: Storage cleanup 스케줄·동시성 계약
        run: |
          node scripts/qa/verify-storage-cleanup-schedules.mjs
          node scripts/qa/verify-storage-cleanup-concurrency.mjs
          node scripts/qa/verify-storage-cleanup-runtime.mjs

      - name: 소셜 대시보드 인덱스 효과
        run: node scripts/qa/verify-cheer-summary-index.mjs

      - name: 로컬 Supabase 종료
        if: always()
        run: supabase stop --no-backup

  qa-contracts:
    name: 배포 환경·환전 층간 계약
    runs-on: ubuntu-latest  # 공개 저장소는 GitHub 호스팅 분이 무료다. 온프렘 러너 그룹은 공개 저장소를 허용하지 않으므로(allows_public_repositories=false) 호스팅 러너를 쓴다(2026-10-12).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 웹 의존성 설치
        run: npm --prefix web ci

      - name: 코드 기반 환경변수 인벤토리·환전 층간 계약
        run: npm --prefix web run test:qa-contracts

  unit-and-build:
    name: 단위 테스트 + 빌드
    runs-on: ubuntu-latest  # 공개 저장소는 GitHub 호스팅 분이 무료다. 온프렘 러너 그룹은 공개 저장소를 허용하지 않으므로(allows_public_repositories=false) 호스팅 러너를 쓴다(2026-10-12).
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: 디자인 토큰 준수
        run: npm run qa:design-tokens

      - name: 웹 단위 + 결제·인증 보안 테스트
        run: npm test

      - name: 프로덕션 빌드
        run: npm run build
        env:
          # 빌드 타임에만 필요한 공개 값. 실제 운영 값은 Vercel 환경변수가 소유한다.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  e2e-cashout:
    name: 환전 브라우저 E2E
    runs-on: ubuntu-latest  # 공개 저장소는 GitHub 호스팅 분이 무료다. 온프렘 러너 그룹은 공개 저장소를 허용하지 않으므로(allows_public_repositories=false) 호스팅 러너를 쓴다(2026-10-12).
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # 2026-10-14: 환전 E2E 가 실제 로컬 Auth 로 로그인하도록 바뀌었다(가짜 쿠키 주입 폐기).
      # 그래서 이 잡은 로컬 Supabase 를 실제로 띄워야 한다. 띄우지 않으면 스펙이 모듈 적재
      # 시점에 환경변수 부재로 죽고 "No tests found" 로 끝난다(런 38540251889).
      - name: 로컬 Supabase 기동
        working-directory: .
        run: |
          # 호스팅 러너에서 전체 스택을 받으면 컨테이너 이미지 받기 제한(toomanyrequests)에 걸린다(런 38541159192).
          # 이 스펙에 필요한 것은 DB·Auth·REST 뿐이라 나머지는 제외해 받는 이미지 수를 줄인다.
          npx supabase start \
            -x realtime -x storage-api -x imgproxy -x studio -x mailpit \
            -x edge-runtime -x logflare -x vector -x supavisor -x postgres-meta
          # status -o env 는 값을 큰따옴표로 감싸 내보낸다. 그대로 GITHUB_ENV 에 넣으면
          # 따옴표가 값의 일부가 되어 new URL() 이 Invalid URL 로 죽는다(런 38551588440).
          npx supabase status -o env | sed 's/^/SUPA_/; s/="\(.*\)"$/=\1/' >> "$GITHUB_ENV"

      - name: 로컬 Supabase 접속값 노출
        working-directory: .
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPA_API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPA_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPA_SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: 환전 격리 환경 프로덕션 빌드
        run: npm run build
        env:
          # NEXT_PUBLIC_* 값은 next build 에서 고정되므로 테스트가 쓰는 것과 같은 값으로 빌드해야 한다.
          # 다르면 Supabase 세션 쿠키 이름이 달라져 로그아웃으로 판정된다.
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium  # 호스팅 러너는 시스템 의존성도 받아야 한다

      - name: 환전 E2E 실행
        run: npx playwright test e2e/cashout-manual.spec.ts --reporter=line

      - name: 실패 시 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  e2e-v2-social:
    name: e2e-v2-social
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      E2E_ENVIRONMENT: staging
      RUN_STAGING_SUPABASE_E2E: "1"
      E2E_BASE_URL: https://haenael-ge-v2-staging-100-b.vercel.app
      STAGING_WEB_BASE_URL: https://haenael-ge-v2-staging-100-b.vercel.app
      SUPABASE_STAGING_PROJECT_REF: ezzklgotgydwxqebfoys
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.QA_STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.QA_STAGING_SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.0

      - name: 웹 의존성 설치
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: staging 결제 기능 활성화
        working-directory: .
        run: supabase secrets set --project-ref "$SUPABASE_STAGING_PROJECT_REF" PAYMENTS_ENABLED=true

      - name: V2 social staging E2E
        run: |
          mkdir -p ../.goal/runs
          set +e
          npx playwright test e2e/social-web-first.spec.ts --project=chromium --reporter=line \
            > ../.goal/runs/e2e-v2-social.log 2>&1
          test_exit=$?
          printf 'E2E_V2_SOCIAL_EXIT=%s\n' "$test_exit" \
            > ../.goal/runs/e2e-v2-social.exit
          exit "$test_exit"

      - name: staging 결제 기능 비활성화 복구
        if: always()
        working-directory: .
        run: |
          supabase secrets set --project-ref "$SUPABASE_STAGING_PROJECT_REF" PAYMENTS_ENABLED=false
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/cheer-order" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}')"
          mkdir -p .goal/runs
          printf 'RESTORE_PAYMENTS_EXIT=0 HTTP_STATUS=%s\n' "$status" \
            > .goal/runs/e2e-v2-social-restore.txt
          rm -f "$response_file"
          test "$status" = "503"

      - name: V2 social 실행 증거 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-v2-social-${{ github.run_id }}
          path: |
            .goal/runs/e2e-v2-social-restore.txt
            .goal/runs/e2e-v2-social.exit
            .goal/runs/e2e-v2-social.log
            web/test-results/
          if-no-files-found: warn
          retention-days: 14
