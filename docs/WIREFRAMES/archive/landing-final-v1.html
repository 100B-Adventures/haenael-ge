<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해낼게 — ① 랜딩 확정 (C 미니멀 + 워드맵 프리뷰 하이브리드)</title>
<style>
  :root{
    --bg:#FBFAF7; --surface:#fff; --ink:#16140F; --muted:#6F6A60; --faint:#9C968B; --line:#E8E4DC;
    --clover:#1B8A4F; --clover-bright:#1F9E5A; --clover-soft:#E7F4EC; --clover-ink:#14613A; --warm:#F4EFE6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       background:#ECEAE4; color:var(--ink); -webkit-font-smoothing:antialiased; padding:28px 16px 64px}
  h1.board{font-size:18px; text-align:center; margin-bottom:4px}
  p.board{font-size:13px; color:#555; text-align:center; margin-bottom:22px}
  .wrap{display:flex; justify-content:center}

  .phone{width:340px; height:712px; background:var(--bg); border:1px solid #d9d5cc;
         border-radius:34px; box-shadow:0 8px 30px rgba(0,0,0,.12); overflow:hidden; position:relative}
  .notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:130px; height:24px;
         background:#000; border-radius:0 0 16px 16px; z-index:5}
  /* 슬로건 히어로 = 화면 중앙 위주, 워드맵 프리뷰는 그 아래 컴팩트 */
  .screen{height:100%; display:flex; flex-direction:column; padding:54px 26px 28px}
  .brand{font-size:13px; font-weight:800; letter-spacing:-.2px}
  .brand .dot{color:var(--clover-bright)}

  /* hero (C 그대로) */
  .hero{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; text-align:center; min-height:0}
  .c-mark{font-size:36px; font-weight:900; letter-spacing:-1px}
  .c-mark .dot{color:var(--clover-bright)}
  .c-slogan{font-size:15px; color:var(--muted); margin:16px 0 0; line-height:1.6}

  /* 워드맵 프리뷰 (컴팩트, 받는사람 보상 미리보기) */
  .pv{flex:0 0 auto; margin:22px 0 22px}
  .pv-cap{font-size:11.5px; color:var(--faint); text-align:center; margin-bottom:8px; font-weight:500}
  .wordmap{background:var(--clover-soft); border-radius:14px; padding:16px 12px; text-align:center; line-height:1.95}
  .wordmap span{display:inline-block; margin:0 4px; color:#2c7a4f}
  .pv-count{font-size:11px; color:var(--muted); text-align:center; margin-top:7px}

  /* CTA */
  .cta{flex:0 0 auto}
  .btn{display:block; width:100%; text-align:center; padding:15px; border-radius:14px; font-size:15px; font-weight:700; border:none; cursor:pointer}
  .btn-primary{background:var(--clover); color:#fff}
  .btn-ghost{background:transparent; color:var(--muted); font-weight:600; font-size:13px; padding:10px; cursor:pointer}
</style>
</head>
<body>
  <h1 class="board">해낼게 — ① 랜딩 확정 <small style="font-weight:400;color:#888">(C 미니멀 + 워드맵 프리뷰 하이브리드 · 가입=write-first)</small></h1>
  <p class="board">DESIGN.md 토큰 적용 · 받는 사람 전용(친구는 ②로 직행) · "시작하기" → 목표쓰기(write-first)</p>

  <div class="wrap">
    <div class="phone"><div class="notch"></div>
      <div class="screen">
        <div class="brand">해낼게<span class="dot">.</span></div>

        <!-- 슬로건 히어로 (C 그대로, 궁금증 훅) -->
        <div class="hero">
          <div class="c-mark">해낼게<span class="dot">.</span></div>
          <div class="c-slogan">응원은 돈으로 하는 겁니다.</div>
        </div>

        <!-- 워드맵 프리뷰 (받는사람 보상 미리보기 · 친구뷰 아님) -->
        <div class="pv">
          <div class="pv-cap">↓ 네 목표 위에 응원이 이렇게 쌓여요</div>
          <div class="wordmap">
            <span style="font-size:17px">화이팅</span><span style="font-size:13px">할수있어</span>
            <span style="font-size:21px">멋지다</span><span style="font-size:13px">존경</span>
            <span style="font-size:15px">고생많아</span><span style="font-size:19px">응원해</span>
            <span style="font-size:13px">힘내자</span>
          </div>
          <div class="pv-count">친구들이 조용히 남긴 한 마디로</div>
        </div>

        <!-- CTA (받는사람 하나 + 보조) -->
        <div class="cta">
          <button class="btn btn-primary">시작하기</button>
          <button class="btn btn-ghost">어떻게 쓰는 건가요?</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
